name: dose-dashboard

services:
  app:
    build:
      context: .
      target: app
    image: dose-dashboard-app
    environment:
      PORT: 8080
      LOG_CAPACITY: ${LOG_CAPACITY:-1000}
    ports:
      # 宿主机端口可通过 APP_PORT 环境变量或 .env 文件配置
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  verify:
    build:
      context: .
      target: verify
    image: dose-dashboard-verify
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: http://app:8080
    restart: "no"

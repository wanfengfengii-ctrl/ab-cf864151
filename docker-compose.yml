name: dose-dashboard

services:
  app:
    build:
      context: .
      target: app
    image: dose-dashboard-app
    environment:
      PORT: 8080
      LOG_RETENTION: ${LOG_RETENTION:-200}
    ports:
      # 宿主机端口可通过 APP_PORT 环境变量配置，默认 8080
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/healthz').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # 一次性校验服务：等待 app 健康后执行 生产构建 + 代码测试 + 冒烟，以退出码汇总结果
  verify:
    build:
      context: .
      target: verify
    image: dose-dashboard-verify
    environment:
      BASE_URL: http://app:8080
    depends_on:
      app:
        condition: service_healthy
    restart: "no"
